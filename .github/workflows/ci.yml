name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wrangler configuration from the template
        run: cp wrangler.example.jsonc wrangler.jsonc
      - name: Phase gate
        run: npm run gate
      - name: Format, lint and type check
        run: npm run check
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - name: Staging build
        run: npx vite build
        env:
          CLOUDFLARE_ENV: staging
          GIT_SHA: ${{ github.sha }}
      - name: Deploy dry run
        run: npx wrangler deploy --dry-run
      - name: Dependency audit
        run: npm audit --audit-level=high
